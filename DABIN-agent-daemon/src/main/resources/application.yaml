spring:
  application:
    name: DABIN-agent-daemon
  main:
    web-application-type: none

agent:
  daemon:
    process-io-threads: 4
    event-aggregation-window: 100ms
    event-aggregation-max-chars: 160
    outbound-queue-capacity: 1024
    reliable-outbound-capacity: 512
    projects: []
    cloud:
      control-plane-url: http://127.0.0.1:48080
      relay-url: ws://127.0.0.1:48180/agent/ws
      reconnect-initial-delay: 1s
      reconnect-max-delay: 30s
  codex:
    executable: codex
    startup-timeout: 30s
    request-timeout: 60s
    experimental-api: true
